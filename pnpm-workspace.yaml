packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@holiday-jp/holiday_jp': ^2.5.2
  '@hono/zod-validator': ^0.9.1
  '@mdi/font': ^7.4.47
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  '@types/qrcode': ^1.5.6
  fake-indexeddb: ^6.2.5
  idb: ^8.0.3
  qrcode: ^1.5.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plugin-pwa: ^1.3.0
  vite-plus: 1.0.0
  vue-draggable-plus: ^0.6.1
  workbox-precaching: ^7.4.1
  workbox-routing: ^7.4.1
  workbox-window: ^7.4.1
  zod: ^4.6.5
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
